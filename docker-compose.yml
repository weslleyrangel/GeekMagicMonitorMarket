version: '3.8'

services:
  geekmagic-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: geekmagic-market-monitor:latest
    container_name: geekmagic-monitor
    restart: unless-stopped
    ports:
      - "3333:3333"
    volumes:
      # Monta o config.json para persistir os ativos e layouts configurados pelo tablet
      - ./config.json:/app/config.json
    environment:
      - PORT=3333
      - NODE_ENV=production
