apiVersion: apps/v1
kind: Deployment
metadata:
  name: geekmagic-monitor
  labels:
    app: geekmagic-monitor
spec:
  replicas: 1 # Réplica única para evitar concorrência de múltiplos containers no mesmo IP de relógio
  selector:
    matchLabels:
      app: geekmagic-monitor
  template:
    metadata:
      labels:
        app: geekmagic-monitor
    spec:
      hostNetwork: true # Permite comunicação direta na rede local com o IP do relógio (192.168.1.x)
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: monitor
          image: geekmagic-market-monitor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3333
              name: http
          env:
            - name: PORT
              value: "3333"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /api/status
              port: 3333
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/status
              port: 3333
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: geekmagic-monitor-svc
  labels:
    app: geekmagic-monitor
spec:
  type: NodePort
  selector:
    app: geekmagic-monitor
  ports:
    - port: 3333
      targetPort: 3333
      nodePort: 30333
      name: http
